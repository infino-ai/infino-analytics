name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Branch protection on main matches this exact string; renaming it leaves
    # a required check that never reports. The job runs tests regardless.
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
