name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Branch protection on main matches this exact string; renaming it leaves
    # a required check that never reports. The job runs tests regardless.
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # .nvmrc is the single source: the MCP lifecycle tests spawn a bare
          # .ts child, so they need Node's type stripping (on by default in 22.18).
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
